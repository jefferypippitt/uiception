name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      # npm's bulk advisory POST often exceeds pnpm's 60s fetchTimeout from GHA
      # (error 23 / "aborted due to timeout"). Real HIGH/CRITICAL findings still
      # fail the job immediately; only registry timeouts are retried.
      - name: Dependency audit
        env:
          pnpm_config_fetch_timeout: "180000"
        shell: bash
        run: |
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for attempt in 1 2 3; do
            echo "::group::pnpm audit (attempt ${attempt}/3)"
            set +e
            pnpm audit --prod --audit-level high 2>&1 | tee "$tmp"
            status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if grep -qE 'aborted due to timeout|error \(23\)' "$tmp"; then
              if [ "$attempt" -lt 3 ]; then
                echo "npm advisory API timed out; retrying in 20s..."
                sleep 20
                continue
              fi
              echo "::error::pnpm audit timed out talking to the npm advisory API after 3 attempts"
              exit 1
            fi
            exit "$status"
          done
